# Çelmak Sipariş Yönetimi — Docker Compose
#
# Kullanım:
#   cp deploy/celmak.env.example deploy/celmak.env   # alan adını doldur
#   docker compose up -d --build
#   docker compose logs -f
#
# Uygulama konteyner içinde 8090'de dinler; host'un 127.0.0.1:8090 portuna
# yayınlanır. Host üzerindeki ters-proxy (bu sunucuda Apache/Virtualmin) bu
# porta yönlendirip HTTPS'i yönetir. 127.0.0.1'e bağlamak, uygulamanın yalnızca
# ters-proxy üzerinden dışarı açılmasını, internete doğrudan kapalı olmasını sağlar.

services:
  app:
    build: .
    image: celmak:latest
    container_name: celmak
    restart: unless-stopped
    env_file:
      - deploy/celmak.env
    environment:
      # Konteyner içi sabitler — env dosyasındaki değerleri ezer.
      NODE_ENV: production
      PORT: "8090"
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - celmak-data:/data

volumes:
  celmak-data:
